name: Build ALMA Android

on:
  push:
    branches:
      - hardening/chat-auth
      - alma-next
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alma_files/ALMA_MVP/android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: alma-debug-keystore-v2

      - name: Create stable debug signing key
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Download Vosk Spanish model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o /tmp/vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          mv /tmp/vosk-model/vosk-model-small-es-0.42 app/src/main/assets/model-es
          printf 'alma-vosk-es-0.42\n' > app/src/main/assets/model-es/uuid
      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA_MVP-debug
          path: alma_files/ALMA_MVP/android_app/app/build/outputs/apk/debug/app-debug.apk
